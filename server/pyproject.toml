[project]
name = "tester-agent"
version = "0.1.0"
description = "TesterAgent — 基于知识库的测试用例生成 Agent（后端）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "langchain-openai>=0.2",
    "openai>=1.40",
    "pydantic>=2.7",
    "mistune>=3.0",
    "json-repair>=0.25",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "reme-ai>=0.4.1.5,<0.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "anyio>=4.0",
    "import-linter>=2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["tester_agent*"]

[tool.setuptools.package-data]
tester_agent = ["store/migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
